name: frontend-en-image

on:
  push:
    branches: [flowlight-en]
  workflow_dispatch:

concurrency:
  group: frontend-en-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tide-canvas-frontend-en" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=flowlight-en
            type=raw,value=latest
      - name: Build the deployment image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: framelyn-en-ci:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend-en
          cache-to: type=gha,mode=max,scope=frontend-en
      - name: Verify the same image in production and test modes
        run: npm run test:runtime
        env:
          RUNTIME_TEST_IMAGE: framelyn-en-ci:${{ github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified image
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for tag in "sha-${COMMIT_SHA}" flowlight-en latest; do
            docker tag "framelyn-en-ci:${COMMIT_SHA}" "${IMAGE_NAME}:${tag}"
            docker push "${IMAGE_NAME}:${tag}"
          done
          {
            echo '### Overseas frontend image'
            echo "Published \`${IMAGE_NAME}:latest\`"
            echo "Rollback tag: \`${IMAGE_NAME}:sha-${COMMIT_SHA}\`"
            echo 'The same tested image runs with APP_ENV=prod or APP_ENV=test.'
          } >> "$GITHUB_STEP_SUMMARY"
