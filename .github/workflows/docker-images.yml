# 推送 flowingLight 分支时自动构建前后端镜像并推到 ghcr.io：
#   ghcr.io/<owner>/tide-canvas-backend:latest  （Go API :8081，host 网络连本机 MySQL/Redis）
#   ghcr.io/<owner>/tide-canvas-frontend:latest （Next SSR :3000，仅监听回环）
# 80/443 与证书由独立的边缘 nginx 容器负责（与 relay 同机共存，按域名分流）。
# 服务器部署见 deploy/docker-compose.yml。
name: docker-images

on:
  push:
    branches: [flowingLight]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: tide-canvas-server
            image: tide-canvas-backend
            build-args: ""
          - name: frontend
            context: tide-canvas-web
            image: tide-canvas-frontend
            # 部署为 host 网络：SSR 直连本机 8081 的后端（8080 被同机 relay 占用）
            build-args: |
              NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action 会自动把镜像名转小写（vit4Ss -> vit4ss）
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 前端把提交 SHA 内联为构建版本；后端镜像收到未使用的 build-arg
          # 不产生副作用。浏览器据此自动发现新前端并安全重载。
          build-args: |
            ${{ matrix.build-args }}
            NEXT_PUBLIC_APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
