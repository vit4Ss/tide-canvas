# Tide Canvas 前端站点（打进前端镜像 /etc/nginx/conf.d/tidecanvas.conf）。
# 容器以 network_mode: host 运行：
#   - 80/443 直接占用宿主机端口
#   - /api、/static 反代 127.0.0.1:8080（同宿主机的后端容器）
#   - 其余请求反代 127.0.0.1:3000（本容器内的 Next SSR 进程）
# 证书由 compose 挂载到 /etc/nginx/cert（只读）：
#   fullchain.pem + privkey.pem（certbot 命名；换证书后 docker restart 生效）

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 与后端 multipart 上限对齐（Next 侧 proxyClientMaxBodySize 同为 100mb）
    client_max_body_size 100m;

    # API 直达后端，绕过 Next 代理（避免大请求体在 node 层缓冲）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # AI 生成类接口可能长时间不返回
        proxy_read_timeout 300s;
    }

    # local 存储模式的静态文件（storage.type=oss 时不会命中）
    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
