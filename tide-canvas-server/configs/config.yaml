# Shared, non-secret defaults. Environment-specific values are layered from
# config.test.yaml / config.prod.yaml and TIDECANVAS_* variables always win.

server:
  port: 8080
  mode: debug

mysql:
  dsn: ""
  host: 127.0.0.1
  port: 3306
  user: root
  password: root
  database: canvas
  params: "charset=utf8mb4&parseTime=True&loc=Local&sql_mode=%27STRICT_TRANS_TABLES%2CNO_ENGINE_SUBSTITUTION%27"
  maxOpenConns: 100
  maxIdleConns: 10
  maxLifetime: 3600

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

jwt:
  secret: change-me-in-production
  accessTTL: 2h
  refreshTTL: 168h
  issuer: tidecanvas

storage:
  type: local
  localDir: ./data/uploads
  publicURL: http://localhost:8080/static
  endpoint: ""
  bucket: ""
  accessKey: ""
  secretKey: ""
  region: ""
  prefix: canvas/uploads/
  cdnDomain: ""
  accelerateDomain: ""
  legacyHosts: ""

cors:
  allowOrigins:
    - http://localhost:3000

llm:
  historyLimit: 20
  contextTokenLimit: 32000

relay:
  baseUrl: https://test-relay.tcmzhan.com
  apiKey: ""

# External side effects are disabled by default. Enable them only with explicit
# environment variables in a protected deployment environment.
eliandapay:
  enabled: false
  gateway: https://api.ndow.cn/
  merchantId: ""
  md5Key: ""
  notifyUrl: http://localhost:8080/api/billing/notify
  returnUrl: http://localhost:3000/billing?pay_status=success

email:
  enabled: false
  host: smtp.gmail.com
  port: 587
  username: ""
  password: ""
  fromAddress: ""
  fromName: Tide Canvas
  replyTo: ""
  ssl: false
  startTLS: true
  codeLength: 6
  codeTTLSeconds: 600
  resendCooldownSeconds: 60
  maxAttempts: 5
  sendCodeIPLimit: 10
  sendCodeIPWindowSeconds: 600
