# Test environment overlay. Credentials are injected through TIDECANVAS_* vars.

server:
  mode: debug

cors:
  allowOrigins:
    - http://localhost:3000
    - https://test-flowlight.tcmzhan.com

relay:
  baseUrl: https://test-relay.tcmzhan.com
  apiKey: ""

eliandapay:
  enabled: false
  notifyUrl: https://test-flowlight.tcmzhan.com/api/billing/notify
  returnUrl: https://test-flowlight.tcmzhan.com/billing?pay_status=success

email:
  enabled: false

# The shared test host uses OSS. Local/branch-preview Compose explicitly
# overrides this to local storage so it remains self-contained.
storage:
  type: oss
  endpoint: https://oss-cn-shanghai.aliyuncs.com
  bucket: flowlinght-test
  prefix: canvas/uploads/
  accelerateDomain: flowlinght-test.oss-accelerate.aliyuncs.com
