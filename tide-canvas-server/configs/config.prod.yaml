# Production overlay. This file intentionally contains no credentials.
# Production startup requires TIDECANVAS_JWT_SECRET and
# TIDECANVAS_RELAY_APIKEY; datastore and integration credentials must also be
# supplied by the deployment environment.

server:
  mode: release

mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  password: ""
  database: canvas

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

jwt:
  secret: change-me-in-production

cors:
  allowOrigins:
    - https://flowlight.tcmzhan.com

relay:
  baseUrl: https://relay.tcmzhan.com
  apiKey: ""

eliandapay:
  enabled: false
  notifyUrl: https://flowlight.tcmzhan.com/api/billing/notify
  returnUrl: https://flowlight.tcmzhan.com/billing?pay_status=success

email:
  enabled: false

storage:
  type: oss
  endpoint: https://oss-cn-shanghai.aliyuncs.com
  bucket: flowlinght
  prefix: canvas/uploads/
  accelerateDomain: flowlinght.oss-accelerate.aliyuncs.com
  publicURL: https://flowlight.tcmzhan.com/static
