# Independent HTTPS site for the Hong Kong test deployment.
map $http_upgrade $lobehub_test_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name test-lobehub.tcmzhan.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/lobehub-acme;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name test-lobehub.tcmzhan.com;

    ssl_certificate /etc/letsencrypt/live/test-lobehub.tcmzhan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-lobehub.tcmzhan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    # Preserve the signed S3 path and Host (including port).
    location ~ ^/lobehub-files(?:/|$) {
        proxy_pass http://127.0.0.1:19000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lobehub_test_connection;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
