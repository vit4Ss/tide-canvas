# Certificate bootstrap only; the application is exposed after account setup.
server {
    listen 80;
    server_name test-lobehub.tcmzhan.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/lobehub-acme;
    }
    location / {
        default_type text/plain;
        return 503 "LobeHub setup in progress\n";
    }
}
