# Include inside the main site's HTTPS server block.
location ^~ /api/lobehub/ {
    access_log off;
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 180s;
}
location ^~ /api/integrations/v1/ {
    # Chat requests carry attached images inline as base64. Keep this at or
    # above the gateway's own cap (maxGatewayRequest) so the limit a user hits
    # is the gateway's, with its explanation, rather than nginx's bare 413.
    client_max_body_size 64m;
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
location = /ai-chat/authorize {
    access_log off;
    add_header Referrer-Policy no-referrer always;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}
