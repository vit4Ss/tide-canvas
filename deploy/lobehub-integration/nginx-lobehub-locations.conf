# Include inside the existing test-lobehub.tcmzhan.com HTTPS server block.
# Keep the existing certificate, S3 bucket location and root proxy.

location = /flowinglight/connect {
    access_log off;
    proxy_pass http://127.0.0.1:8081/api/lobehub/bridge;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}
location = /flowinglight/bind {
    access_log off;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8081/api/lobehub/bind;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 180s;
}
location = /flowinglight/auth-check {
    internal;
    access_log off;
    proxy_pass http://127.0.0.1:8081/api/lobehub/session-check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 45s;
}

# Sign-in always starts from the main account; a direct visit works as well.
location = /signin { return 302 https://test-flowlight.tcmzhan.com/ai-chat; }
location = /signup { return 302 https://test-flowlight.tcmzhan.com/ai-chat; }

# Authentication and public configuration must remain reachable without the
# session subrequest (get-session/list-accounts are also used by that subrequest).
location ^~ /api/auth/ {
    access_log off;
    proxy_pass http://127.0.0.1:3210;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}
location = /trpc/lambda/config.getGlobalConfig {
    proxy_pass http://127.0.0.1:3210;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}

# Protect server-side data/tools, including existing LobeHub sessions after a
# main-account disablement. Static assets and the application's own auth remain
# under their original locations. The model gateway independently checks the key.
location ~ ^/(trpc|webapi|api)/ {
    auth_request /flowinglight/auth-check;
    error_page 401 = @lobehub_main_login_required;
    error_page 403 = @lobehub_main_forbidden;
    proxy_pass http://127.0.0.1:3210;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
location @lobehub_main_login_required {
    default_type application/json;
    return 401 '{"error":{"json":{"message":"请从主站重新进入 AI 聊天","code":-32001,"data":{"code":"UNAUTHORIZED","httpStatus":401}}}}';
}
location @lobehub_main_forbidden {
    default_type application/json;
    return 403 '{"error":{"json":{"message":"主站账号不可用，请联系管理员","code":-32003,"data":{"code":"FORBIDDEN","httpStatus":403}}}}';
}
