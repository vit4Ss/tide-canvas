# Tide Canvas 服务器部署（测试环境，与 relay 中转站同机共存）。
#
# 公网入口是宿主机原生安装的 nginx（80/443，按域名分流 + 统一终结 TLS），
# 站点配置与安装步骤见本目录 nginx/README 注释与 nginx/conf.d/*.conf。
#
# 端口规划（全 host 网络）：
#   80/443 —— 宿主机 nginx（唯一入口）
#   8080   —— relay-backend（apirouter 项目，不动）
#   8090   —— relay-frontend（apirouter 项目，挂"让位版"配置后仅监听回环）
#   8081   —— tidecanvas-backend
#   3000   —— tidecanvas 前端 Next SSR（仅监听回环）
#
# 使用：
#   1. docker login ghcr.io -u <github用户名> -p <PAT(read:packages)>
#   2. docker compose pull && docker compose up -d
# 更新版本：重复第 2 步（CI 每次推 flowingLight 都会刷新 :latest）。

services:
  backend:
    image: ghcr.io/vit4ss/tide-canvas-backend:latest
    container_name: tidecanvas-backend
    restart: unless-stopped
    network_mode: host          # 通过 127.0.0.1:3306/6379 连本机 mysql/redis
    environment:
      TIDECANVAS_ENV: test        # 选择 configs/config.test.yaml 叠加层
      TIDECANVAS_SERVER_PORT: "8081" # 8080 被同机 relay-backend 占用
      # World Labs Marble 凭据只在运行时注入，不写入镜像或仓库。
      # 可在 deploy/.env 或执行 docker compose 前的宿主机环境中设置。
      TIDECANVAS_WORLDLABS_APIKEY: "${TIDECANVAS_WORLDLABS_APIKEY:-}"
      TIDECANVAS_WORLDLABS_POLLINTERVAL: "${TIDECANVAS_WORLDLABS_POLLINTERVAL:-5s}"
      TIDECANVAS_WORLDLABS_TIMEOUT: "${TIDECANVAS_WORLDLABS_TIMEOUT:-20m}"
      # 本站视频下载器；不再依赖 APIRouter/Relay 的下载接口或 API Key。
      TIDECANVAS_VIDEODOWNLOADER_ENABLED: "${TIDECANVAS_VIDEODOWNLOADER_ENABLED:-true}"
      TIDECANVAS_VIDEODOWNLOADER_MAXFILEBYTES: "${TIDECANVAS_VIDEODOWNLOADER_MAXFILEBYTES:-536870912}"
      TIDECANVAS_VIDEODOWNLOADER_MAXCONCURRENT: "${TIDECANVAS_VIDEODOWNLOADER_MAXCONCURRENT:-2}"
      TIDECANVAS_VIDEODOWNLOADER_RESOLVETIMEOUT: "${TIDECANVAS_VIDEODOWNLOADER_RESOLVETIMEOUT:-60s}"
      TIDECANVAS_VIDEODOWNLOADER_DOWNLOADTIMEOUT: "${TIDECANVAS_VIDEODOWNLOADER_DOWNLOADTIMEOUT:-15m}"
      # OSS 密钥不进镜像，在这里注入或在后台「配置管理→存储配置」录入：
      # TIDECANVAS_STORAGE_ACCESSKEY: ""
      # TIDECANVAS_STORAGE_SECRETKEY: ""
      # TIDECANVAS_STORAGE_ACCELERATEENABLED: "false" # 上传走地域 OSS；模型取图走 CDN（未配置则地域 OSS）
      # 供应商余额监控凭据（含 DLAPI）全部在后台「配置管理 → 供应商余额」
      # 维护，保存后实时生效；旧的 TIDECANVAS_BALANCEMONITOR_* 环境变量已废弃。
    volumes:
      - uploads-data:/app/data/uploads   # local 存储模式的上传目录（oss 模式下备而不用）

  frontend:
    image: ghcr.io/vit4ss/tide-canvas-frontend:latest
    container_name: tidecanvas-frontend
    restart: unless-stopped
    network_mode: host          # Next SSR 监听 127.0.0.1:3000，仅供宿主机 nginx 反代
    depends_on:
      - backend

volumes:
  uploads-data:
