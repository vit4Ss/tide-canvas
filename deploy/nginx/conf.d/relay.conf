# relay.tcmzhan.com —— ScarecrowToken 中转站（apirouter 项目）。
# 边缘 nginx 接管 80/443 后，relay-frontend 不能再占这两个端口：
# 把它容器内的 nginx 改为 listen 127.0.0.1:8090（挂替换配置即可，无需重打镜像），
# 443 的 server 块删掉——TLS 统一在这里终结。relay-backend 仍占 8080，不用动。

server {
    listen 80;
    server_name relay.tcmzhan.com;
    # Let's Encrypt http-01 续期校验透传给 relay-frontend(它的 webroot 里有挑战文件）
    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8090;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name relay.tcmzhan.com;

    # 文件名沿用 apirouter 项目的约定(宿主机 /root/apirouter/cert 直挂)
    ssl_certificate     /etc/nginx/cert/relay/server.pem;
    ssl_certificate_key /etc/nginx/cert/relay/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 中转站的模型调用可能是长请求/流式；上限须高于 relay-frontend 内部的
        # 900s（它为同步 gpt-image-2 生成设的天花板），否则 edge 会先一步 504
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }
}
