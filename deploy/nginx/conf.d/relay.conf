# relay.tcmzhan.com —— ScarecrowToken 中转站（apirouter 项目）。
# 边缘 nginx 接管 80/443 后，relay-frontend 不能再占这两个端口：
# 把它容器内的 nginx 改为 listen 127.0.0.1:8090（挂替换配置即可，无需重打镜像），
# 443 的 server 块删掉——TLS 统一在这里终结。relay-backend 仍占 8080，不用动。

server {
    listen 80;
    server_name relay.tcmzhan.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name relay.tcmzhan.com;

    ssl_certificate     /etc/nginx/cert/relay/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/relay/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 中转站的模型调用可能是长请求/流式
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
}
