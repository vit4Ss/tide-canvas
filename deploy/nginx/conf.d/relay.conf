# relay.tcmzhan.com —— ScarecrowToken 中转站（apirouter 项目）。
# 部署到宿主机原生 nginx：拷到 /etc/nginx/conf.d/relay.conf。
# 上游 8090 = relay-frontend（挂"让位版"配置后仅监听 127.0.0.1:8090，
# 它内部再把 /api /v1 反代给 8080 的 relay-backend）。
# 证书：/root/apirouter/cert/（server.pem + server.key，apirouter 原目录直读）。

server {
    listen 80;
    server_name relay.tcmzhan.com;
    # Let's Encrypt http-01 续期校验透传给 relay-frontend（它的 webroot 里有挑战文件）
    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8090;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name relay.tcmzhan.com;

    ssl_certificate     /root/apirouter/cert/server.pem;
    ssl_certificate_key /root/apirouter/cert/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    # 视频生成 API(OpenApiVideoController @ /openapi/v1)——前端容器的"让位版"
    # 配置只反代 /api /v1 两个前缀,/openapi 会落进 SPA 静态文件:GET 回 index.html、
    # POST 直接 405(2026-07-14 文生视频报"relaymedia: HTTP 405"的根因)。
    # 在宿主机层直通 relay-backend(8080),不经前端容器。
    location /openapi/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_max_body_size 64m;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 上限须高于 relay-frontend 内部的 900s（同步 gpt-image-2 的天花板），
        # 否则这里会先一步 504
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }
}
