# flowlight.tcmzhan.com —— TideCanvas（流光）站点。
# 部署到宿主机原生 nginx：拷到 /etc/nginx/conf.d/flowlight.conf。
# 上游都在本机回环：8081 = tidecanvas-backend，3000 = tidecanvas 前端 Next SSR。
# 证书：/root/flowfinght/cert/（fullchain.pem + privkey.pem）。

server {
    listen 80;
    server_name flowlight.tcmzhan.com;
    return 301 https://$host$request_uri;
}

server {
    # http2 用旧写法（listen 行内），兼容发行版仓库里 1.25 之前的 nginx
    listen 443 ssl http2;
    server_name flowlight.tcmzhan.com;

    ssl_certificate     /root/flowfinght/cert/fullchain.pem;
    ssl_certificate_key /root/flowfinght/cert/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 与后端 multipart 上限对齐（Next 侧 proxyClientMaxBodySize 同为 100mb）
    client_max_body_size 100m;

    # API 直达后端，绕过 Next（避免大请求体在 node 层缓冲）
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # AI 生成/对话可能长时间不返回；关缓冲让流式回复即刻透传
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # local 存储模式的静态文件（storage.type=oss 时不会命中）
    location /static/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
