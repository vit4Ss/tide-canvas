name: ${COMPOSE_PROJECT_NAME:-tide-canvas-flowlight-preview}

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-canvas}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - app

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

  backend:
    image: ghcr.io/${GHCR_OWNER:-vit4ss}/tide-canvas-backend:${IMAGE_TAG:-flowlight-20260809}
    restart: unless-stopped
    init: true
    environment:
      TIDECANVAS_ENV: test
      TIDECANVAS_SERVER_PORT: "8080"
      TIDECANVAS_SERVER_MODE: release
      TIDECANVAS_MYSQL_HOST: mysql
      TIDECANVAS_MYSQL_PORT: "3306"
      TIDECANVAS_MYSQL_USER: root
      TIDECANVAS_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TIDECANVAS_MYSQL_DATABASE: ${MYSQL_DATABASE:-canvas}
      TIDECANVAS_REDIS_ADDR: redis:6379
      TIDECANVAS_REDIS_PASSWORD: ""
      TIDECANVAS_REDIS_DB: "0"
      TIDECANVAS_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TIDECANVAS_RELAY_APIKEY: ${RELAY_API_KEY:-}
      TIDECANVAS_STORAGE_TYPE: ${STORAGE_TYPE:-local}
      TIDECANVAS_STORAGE_LOCALDIR: /app/data/uploads
      TIDECANVAS_STORAGE_PUBLICURL: ${PUBLIC_API_ORIGIN:-http://localhost:8081}/static
      TIDECANVAS_STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      TIDECANVAS_STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      TIDECANVAS_STORAGE_ACCESSKEY: ${STORAGE_ACCESS_KEY:-}
      TIDECANVAS_STORAGE_SECRETKEY: ${STORAGE_SECRET_KEY:-}
      TIDECANVAS_STORAGE_PREFIX: ${STORAGE_PREFIX:-canvas/uploads/}
      TIDECANVAS_STORAGE_CDNDOMAIN: ${STORAGE_CDN_DOMAIN:-}
      TIDECANVAS_STORAGE_ACCELERATEDOMAIN: ${STORAGE_ACCELERATE_DOMAIN:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8080"
    volumes:
      - uploads-data:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app
    logging:
      options:
        max-size: 10m
        max-file: "5"

  frontend:
    image: ghcr.io/${GHCR_OWNER:-vit4ss}/tide-canvas-frontend:${IMAGE_TAG:-flowlight-20260809}
    restart: unless-stopped
    init: true
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app
    logging:
      options:
        max-size: 10m
        max-file: "5"

networks:
  app:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  uploads-data:
